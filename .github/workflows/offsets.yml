name: cs2-offsets

# Fully cloud. No dev PC. Polls CS2's public depot; on a new build it downloads
# the DLLs anonymously, dumps offsets offline (no running game), signs and
# publishes. See PLAN.md.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min
  workflow_dispatch: {}       # manual run / first validation
  push:
    paths:
      - .github/workflows/offsets.yml   # run on changes to the pipeline itself

concurrency:
  group: cs2-offsets
  cancel-in-progress: false

permissions:
  contents: write             # commit offsets/ back to the repo
  issues: write               # open an issue if a dump fails

jobs:
  offsets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # 1) New build?
      - name: Check CS2 build
        id: build
        run: python scripts/check_build.py

      - name: Up to date
        if: steps.build.outputs.new == ''
        run: echo "no new build; nothing to do"

      # 2) Pull the freshly-dumped offsets for the new build. a2x/cs2-dumper
      #    publishes per-build output (offsets.hpp / client_dll.hpp /
      #    buttons.hpp / info.json) in exactly the format make_offsets.py parses.
      #    We pull it the moment our depot poller sees a new build - automatic,
      #    no dev PC. (v2: run our own offline dumper over DepotDownloader-pulled
      #    DLLs - anonymous depot pull is already proven working in CI.)
      - name: Fetch offsets dump
        if: steps.build.outputs.new != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dump | Out-Null
          $base = "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output"
          foreach ($f in "offsets.hpp","client_dll.hpp","buttons.hpp","info.json") {
            Invoke-WebRequest "$base/$f" -OutFile "dump/$f" -UseBasicParsing
          }
          Get-ChildItem dump | ForEach-Object { Write-Host $_.Name $_.Length }

      # 3) Assemble (fail-closed: exits non-zero if a required offset is missing).
      - name: Assemble payload
        if: steps.build.outputs.new != ''
        run: >
          python scripts/make_offsets.py
          --dump-dir dump
          --steam-buildid ${{ steps.build.outputs.buildid }}
          --out payload.json

      # Build-gate: never publish a dump whose game build we already published
      # (prevents re-signing stale offsets if the source hasn't refreshed yet
      # after a Steam update - the DLL would reject a stale build anyway, but we
      # don't even publish it).
      - name: Gate on new build number
        id: gate
        if: steps.build.outputs.new != ''
        shell: pwsh
        run: |
          $new = (Get-Content payload.json | ConvertFrom-Json).build
          $old = 0
          if (Test-Path offsets/latest.json) {
            $pub = Get-Content offsets/latest.json | ConvertFrom-Json
            $old = [int]$pub.build
          }
          if ($new -le $old) {
            Write-Host "source not refreshed yet (build $new <= published $old); skipping"
            "publish=" | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            Write-Host "new build $new (was $old) -> publish"
            "publish=yes" | Out-File -Append $env:GITHUB_OUTPUT
          }

      # 4) Sign (private key = secret, never in the repo).
      - name: Sign
        if: steps.gate.outputs.publish == 'yes'
        env:
          OFFSET_SIGNING_KEY: ${{ secrets.OFFSET_SIGNING_KEY }}
        run: python scripts/sign.py --payload payload.json --out latest.json

      # 5) Publish: commit latest.json + by-build/<build>.json to the repo.
      - name: Publish to repo
        if: steps.gate.outputs.publish == 'yes'
        shell: pwsh
        run: |
          $build = (Get-Content payload.json | ConvertFrom-Json).build
          New-Item -ItemType Directory -Force offsets/by-build | Out-Null
          Copy-Item latest.json offsets/latest.json -Force
          Copy-Item latest.json "offsets/by-build/$build.json" -Force
          git config user.name  "fumetsu-bot"
          git config user.email "bot@fumetsu.cc"
          git add offsets/latest.json "offsets/by-build/$build.json"
          git commit -m "offsets: build $build (steam ${{ steps.build.outputs.buildid }})"
          git push

      # 6) Push to fumetsu.cc origin so /data.json serves it. Optional deploy
      #    hook; if unset, fumetsu.cc pulls offsets/latest.json from the repo.
      - name: Deploy to fumetsu.cc
        if: steps.gate.outputs.publish == 'yes' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.FUMETSU_DEPLOY_HOOK }}
        shell: pwsh
        run: |
          Invoke-RestMethod -Method Post -Uri $env:HOOK `
            -ContentType application/json -InFile latest.json

      # Fail-closed alarm: if we had a new build but produced no latest.json.
      - name: Open issue on dump failure
        if: failure() && steps.build.outputs.new != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `offset dump failed for steam build ${{ steps.build.outputs.buildid }}`,
              body: `The offline dump did not produce a complete, signable payload. No offsets were published. Run logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
